<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ritam Enterprise</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#73777d;--line:#e5e7eb;--accent:#111827;--green:#16824b;--red:#c43b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}
.app{max-width:1100px;margin:auto;padding:18px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:3px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#111827;color:white;cursor:pointer}.btn.secondary{background:white;color:#111827;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:26px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}
.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 14px;font-weight:700}.tab.active{background:#111827;color:white;border-color:#111827}
.section{display:none}.section.active{display:block}.section-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.section-head h2{margin:0;font-size:19px}
table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:12px;color:var(--muted);text-transform:uppercase}tr:last-child td{border-bottom:0}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;font-size:15px}
.sale-items{margin-top:14px}.itemrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:8px}.itemrow input,.itemrow select{padding:10px;border:1px solid var(--line);border-radius:10px}
.totalbox{margin-top:15px;background:#111827;color:white;border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:8px}.totalbox .big{font-size:28px;font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:16px}
.badge{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f7}.badge.low{background:#fff0f0;color:var(--red)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.sheet{background:white;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:18px}.sheet h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:white;padding:12px 16px;border-radius:12px;display:none;z-index:10}
@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.itemrow{grid-template-columns:1fr 90px 100px 100px auto}.itemrow input:first-child{grid-column:1/-1}.app{padding:14px 12px 90px}table{font-size:13px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">Shop Manager</div><div class="sub">Inventory • Sales • Customers • Non-GST Bills</div></div><div class="actions"><button class="btn" onclick="openSale()">+ New Sale</button></div></div>

  <div class="grid">
    <div class="card stat"><div class="label">Today's Sales</div><div class="value" id="todaySales">₹0</div></div>
    <div class="card stat"><div class="label">Today's Collection</div><div class="value green" id="todayPaid">₹0</div></div>
    <div class="card stat"><div class="label">Outstanding</div><div class="value red" id="outstanding">₹0</div></div>
    <div class="card stat"><div class="label">Low Stock</div><div class="value" id="lowStock">0</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="inventory">Inventory</button>
    <button class="tab" data-tab="customers">Customers</button>
    <button class="tab" data-tab="bills">Bills</button>
  </div>

  <section id="dashboard" class="section active">
    <div class="section-head"><h2>Recent Sales</h2><button class="btn secondary" onclick="openSale()">Create Bill</button></div>
    <div id="recentSales"></div>
  </section>

  <section id="inventory" class="section">
    <div class="section-head"><h2>Inventory</h2><button class="btn" onclick="openInventory()">+ Add Stock</button></div>
    <div id="inventoryTable"></div>
  </section>

  <section id="customers" class="section">
    <div class="section-head"><h2>Customers</h2><button class="btn" onclick="openCustomer()">+ Customer</button></div>
    <div id="customerTable"></div>
  </section>

  <section id="bills" class="section">
    <div class="section-head"><h2>Bills</h2></div>
    <div id="billTable"></div>
  </section>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='shop_manager_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 products:[
  {id:1,name:'Cement',unit:'bag',stock:500,rate:420,min:30},
  {id:2,name:'TMT',unit:'kg',stock:1000,rate:65,min:100},
  {id:3,name:'Sand',unit:'truck',stock:10,rate:5000,min:2},
  {id:4,name:'Bricks',unit:'piece',stock:5000,rate:9,min:500},
  {id:5,name:'Chips',unit:'truck',stock:8,rate:4500,min:2}
 ],customers:[{id:1,name:'Walk-in Customer',phone:'',address:''}],sales:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function dateStr(d=new Date()){return d.toLocaleDateString('en-IN')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
function render(){
 let today=new Date().toDateString(), ts=db.sales.filter(s=>new Date(s.date).toDateString()==today);
 document.getElementById('todaySales').textContent=money(ts.reduce((a,s)=>a+s.total,0));
 document.getElementById('todayPaid').textContent=money(ts.reduce((a,s)=>a+s.paid,0));
 document.getElementById('outstanding').textContent=money(db.sales.reduce((a,s)=>a+s.balance,0));
 document.getElementById('lowStock').textContent=db.products.filter(p=>p.stock<=p.min).length;
 renderRecent(); renderInventory(); renderCustomers(); renderBills();
}
function renderRecent(){
 let rows=db.sales.slice().reverse().slice(0,8);
 document.getElementById('recentSales').innerHTML=rows.length?`<table><tr><th>Bill</th><th>Customer</th><th>Date</th><th>Total</th><th>Balance</th></tr>${rows.map(s=>`<tr><td>${s.no}</td><td>${s.customer}</td><td>${dateStr(new Date(s.date))}</td><td>${money(s.total)}</td><td class="${s.balance?'red':'green'}">${money(s.balance)}</td></tr>`).join('')}</table>`:'<div class="empty">No sales yet. Create your first bill.</div>';
}
function renderInventory(){
 document.getElementById('inventoryTable').innerHTML=`<table><tr><th>Material</th><th>Stock</th><th>Rate</th><th>Status</th></tr>${db.products.map(p=>`<tr><td><b>${p.name}</b><div class="sub">per ${p.unit}</div></td><td>${p.stock}</td><td>${money(p.rate)}</td><td>${p.stock<=p.min?'<span class="badge low">LOW STOCK</span>':'<span class="badge">OK</span>'}</td></tr>`).join('')}</table>`;
}
function renderCustomers(){
 let rows=db.customers.map(c=>{let ss=db.sales.filter(s=>s.customerId==c.id);return {...c,total:ss.reduce((a,s)=>a+s.total,0),bal:ss.reduce((a,s)=>a+s.balance,0)}})
 document.getElementById('customerTable').innerHTML=`<table><tr><th>Customer</th><th>Phone</th><th>Purchases</th><th>Outstanding</th></tr>${rows.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone||'—'}</td><td>${money(c.total)}</td><td class="${c.bal?'red':'green'}">${money(c.bal)}</td></tr>`).join('')}</table>`;
}
function renderBills(){
 let rows=db.sales.slice().reverse();
 document.getElementById('billTable').innerHTML=rows.length?`<table><tr><th>Bill</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr>${rows.map(s=>`<tr><td>${s.no}</td><td>${s.customer}</td><td>${money(s.total)}</td><td>${s.balance?'Credit':'Paid'}</td><td><button class="btn secondary" onclick="showBill(${s.id})">View</button></td></tr>`).join('')}</table>`:'<div class="empty">No bills generated.</div>';
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}

function openCustomer(){
 document.getElementById('sheet').innerHTML=`<h2>Add Customer</h2><div class="formgrid">
 <div class="field"><label>Name</label><input id="cname" placeholder="Customer name"></div>
 <div class="field"><label>Phone</label><input id="cphone" inputmode="tel" placeholder="Phone number"></div>
 <div class="field"><label>Address</label><input id="caddr" placeholder="Optional"></div></div>
 <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="addCustomer()">Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;
 document.getElementById('modal').classList.add('show')
}
function addCustomer(){let n=document.getElementById('cname').value.trim();if(!n)return toast('Enter customer name');db.customers.push({id:Date.now(),name:n,phone:document.getElementById('cphone').value,address:document.getElementById('caddr').value});save();closeModal();toast('Customer added')}

function openInventory(){
 document.getElementById('sheet').innerHTML=`<h2>Add / Update Stock</h2><div class="formgrid">
 <div class="field"><label>Material</label><input id="pname" placeholder="e.g. Cement"></div>
 <div class="field"><label>Unit</label><input id="punit" placeholder="bag / kg / truck"></div>
 <div class="field"><label>Quantity to add</label><input id="pqty" type="number" min="0"></div>
 <div class="field"><label>Selling rate per unit</label><input id="prate" type="number" min="0"></div>
 <div class="field"><label>Low-stock threshold</label><input id="pmin" type="number" min="0" value="10"></div></div>
 <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="addStock()">Save Stock</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;
 document.getElementById('modal').classList.add('show')
}
function addStock(){let n=document.getElementById('pname').value.trim(),u=document.getElementById('punit').value.trim(),q=+document.getElementById('pqty').value||0,r=+document.getElementById('prate').value||0,m=+document.getElementById('pmin').value||0;if(!n||!u)return toast('Enter material and unit');let p=db.products.find(x=>x.name.toLowerCase()==n.toLowerCase());if(p){p.stock+=q;p.rate=r||p.rate;p.min=m}else db.products.push({id:Date.now(),name:n,unit:u,stock:q,rate:r,min:m});save();closeModal();toast('Inventory updated')}

function openSale(){
 let opts=db.customers.map(c=>`<option value="${c.id}">${c.name}${c.phone?' — '+c.phone:''}</option>`).join('');
 document.getElementById('sheet').innerHTML=`<h2>New Non-GST Bill</h2>
 <div class="formgrid"><div class="field"><label>Customer</label><select id="saleCustomer">${opts}</select></div><div class="field"><label>Bill date</label><input id="saleDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
 <div class="sale-items" id="saleItems"></div>
 <button class="btn secondary" onclick="addSaleRow()">+ Add Material</button>
 <div class="formgrid" style="margin-top:14px"><div class="field"><label>Discount</label><input id="discount" type="number" value="0" oninput="calcSale()"></div><div class="field"><label>Amount Paid</label><input id="paid" type="number" value="0" oninput="calcSale()"></div></div>
 <div class="totalbox"><div>Total<br><span class="big" id="saleTotal">₹0</span></div><div style="text-align:right">Balance<br><span class="big" id="saleBalance">₹0</span></div></div>
 <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="saveSale()">Generate Bill</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;
 document.getElementById('modal').classList.add('show');addSaleRow()
}
function addSaleRow(){
 let wrap=document.getElementById('saleItems'), id='r'+Date.now()+Math.random();
 let opts=db.products.map(p=>`<option value="${p.id}">${p.name} (stock ${p.stock} ${p.unit})</option>`).join('');
 let d=document.createElement('div');d.className='itemrow';d.id=id;d.innerHTML=`<select class="prod" onchange="calcSale()">${opts}</select><input class="qty" type="number" min="0" step="0.01" value="1" oninput="calcSale()"><input class="rate" type="number" min="0" value="${db.products[0]?.rate||0}" oninput="calcSale()"><input class="amt" readonly value="0"><button class="btn secondary" onclick="this.parentElement.remove();calcSale()">×</button>`;wrap.appendChild(d);calcSale()
}
function calcSale(){
 let subtotal=0;document.querySelectorAll('.itemrow').forEach(r=>{let p=db.products.find(x=>x.id==r.querySelector('.prod').value);let qty=+r.querySelector('.qty').value||0;r.querySelector('.rate').value=r.querySelector('.rate').value||p.rate;let a=qty*(+r.querySelector('.rate').value||0);r.querySelector('.amt').value=a.toFixed(2);subtotal+=a});let dis=+document.getElementById('discount')?.value||0,total=Math.max(0,subtotal-dis),paid=+document.getElementById('paid')?.value||0;document.getElementById('saleTotal').textContent=money(total);document.getElementById('saleBalance').textContent=money(Math.max(0,total-paid))
}
function saveSale(){
 let customerId=+document.getElementById('saleCustomer').value, c=db.customers.find(x=>x.id==customerId),items=[],ok=true;
 document.querySelectorAll('.itemrow').forEach(r=>{let pid=+r.querySelector('.prod').value,p=db.products.find(x=>x.id==pid),qty=+r.querySelector('.qty').value||0,rate=+r.querySelector('.rate').value||0;if(qty<=0||qty>p.stock){ok=false;toast(`Insufficient ${p.name} stock`);return}items.push({productId:pid,name:p.name,unit:p.unit,qty,rate,amount:qty*rate})});
 if(!ok||!items.length)return;
 let subtotal=items.reduce((a,i)=>a+i.amount,0),discount=+document.getElementById('discount').value||0,total=Math.max(0,subtotal-discount),paid=Math.min(total,+document.getElementById('paid').value||0);
 items.forEach(i=>db.products.find(p=>p.id==i.productId).stock-=i.qty);
 let sale={id:Date.now(),no:'BILL-'+String(db.sales.length+1).padStart(5,'0'),date:new Date(document.getElementById('saleDate').value+'T12:00:00').toISOString(),customerId,customer:c.name,items,subtotal,discount,total,paid,balance:total-paid};
 db.sales.push(sale);save();closeModal();toast(`Bill ${sale.no} created`);showBill(sale.id)
}
function showBill(id){
 let s=db.sales.find(x=>x.id==id);if(!s)return;
 document.getElementById('sheet').innerHTML=`<div style="text-align:center"><h2 style="margin-bottom:3px">NON-GST BILL</h2><div class="sub">Shop Manager • ${s.no} • ${dateStr(new Date(s.date))}</div></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><b>Customer:</b> ${s.customer}<table style="margin-top:12px"><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>${s.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty} ${i.unit}</td><td>${money(i.rate)}</td><td>${money(i.amount)}</td></tr>`).join('')}</table><div style="margin-top:14px;text-align:right"><div>Subtotal: ${money(s.subtotal)}</div><div>Discount: ${money(s.discount)}</div><h2>Total: ${money(s.total)}</h2><div class="green">Paid: ${money(s.paid)}</div><div class="red">Balance: ${money(s.balance)}</div></div><div style="margin-top:18px;display:flex;gap:8px"><button class="btn" onclick="shareBill(${s.id})">Share Bill</button><button class="btn secondary" onclick="window.print()">Print / PDF</button><button class="btn secondary" onclick="closeModal()">Close</button></div>`;
 document.getElementById('modal').classList.add('show')
}
async function shareBill(id){
 let s=db.sales.find(x=>x.id==id);let text=`NON-GST BILL ${s.no}\nCustomer: ${s.customer}\nTotal: ${money(s.total)}\nPaid: ${money(s.paid)}\nBalance: ${money(s.balance)}\n\n${s.items.map(i=>`${i.name}: ${i.qty} ${i.unit} × ${money(i.rate)} = ${money(i.amount)}`).join('\n')}`;
 if(navigator.share) await navigator.share({title:s.no,text}); else {await navigator.clipboard?.writeText(text);toast('Bill copied to clipboard')}
}
render();
</script>
</body>
</html>
