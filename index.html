<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://oofprnqowhgoiojcqkxb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fBvNOwvd5snRD2DagSJZtA_MxQPM2MW';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    autoRefreshToken: true,
    persistSession: true,
    detectSessionInUrl: true,
    experimental: { passkey: true }
  }
});

const $ = id => document.getElementById(id);
const state = { page:'dashboard', shop:null, products:[], customers:[], bills:[], billItems:[], payments:[], loading:false };
function applyTheme(theme){
  document.body.classList.toggle('dark',theme==='dark');
  localStorage.setItem('ritam-theme',theme);
  const b=$('themeToggle');
  if(b){ b.querySelector('.theme-icon').textContent=theme==='dark'?'☀':'☾'; b.querySelector('.theme-label').textContent=theme==='dark'?'Light':'Dark'; }
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',theme==='dark'?'#080d16':'#f6f8fc');
}
function initTheme(){ applyTheme(localStorage.getItem('ritam-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')); }
const money = n => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));
const localDate = d => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date(d));
const billPayments = b => state.payments.filter(p=>p.bill_id===b.id).reduce((s,p)=>s+Number(p.amount||0),0);
const billOutstanding = b => Math.max(0,Number(b.grand_total||0)-billPayments(b));
const customerBalance = c => Math.max(0,Number(c.opening_balance||0)+state.bills.filter(b=>b.customer_id===c.id).reduce((s,b)=>s+Number(b.grand_total||0),0)-state.payments.filter(p=>p.customer_id===c.id).reduce((s,p)=>s+Number(p.amount||0),0));
const totalOutstanding = () => state.customers.reduce((s,c)=>s+customerBalance(c),0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function msg(type,text){ return `<div class="${type==='error'?'error':'success'}">${esc(text)}</div>`; }
function setAuthMessage(type,text){ $('authMsg').innerHTML = text ? msg(type,text) : ''; }
function modal(html){ $('modalRoot').innerHTML = `<div class="modal-back" id="modalBack"><div class="modal">${html}</div></div>`; $('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()}); }
function closeModal(){ $('modalRoot').innerHTML=''; }

async function getShop(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return null;
  const {data,error}=await sb.from('shop_members').select('shop_id,role,shops(id,name,address,phone,email,logo_url)').eq('user_id',user.id).limit(1).maybeSingle();
  if(error) throw error;
  return data ? {id:data.shop_id,role:data.role,...data.shops} : null;
}
async function loadAll(){
  state.shop=await getShop();
  if(!state.shop) throw new Error('Your login is not linked to a shop yet.');
  const id=state.shop.id;
  const [p,c,b,bi,pm]=await Promise.all([

async function billModal(){
  const products=state.products;modal(`<div class="modal-head"><h3>Create non-GST bill</h3><button class="btn secondary" id="closeBill">Close</button></div><form id="billForm"><div class="form-grid"><div class="field"><label>Customer</label><select name="customer"><option value="">Walk-in customer</option>${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Paid amount</label><input name="paid" type="number" step="0.01" value="0"></div></div><div class="field"><label>Discount</label><input name="discount" type="number" step="0.01" value="0"></div><div class="bill-items" id="billItems"><div class="bill-row"><select class="wide product"><option value="">Select product</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock} ${esc(p.unit)})</option>`).join('')}</select><input class="qty" type="number" step="0.001" min="0.001" placeholder="Qty"><input class="rate" type="number" step="0.01" placeholder="Rate"><button type="button" class="btn danger small remove">×</button></div></div><button type="button" class="btn secondary small" id="addLine">+ Add item</button><div class="right" style="margin:16px 0;font-size:18px;font-weight:800">Total: <span id="billTotal">₹0.00</span></div><button class="btn accent" type="submit">Save bill</button><div id="billMsg"></div></form>`);
  $('closeBill').onclick=closeModal;const items=$('billItems');const recalc=()=>{let t=0;items.querySelectorAll('.bill-row').forEach(r=>{t+=Number(r.querySelector('.qty').value||0)*Number(r.querySelector('.rate').value||0)});t-=Number(document.querySelector('[name=discount]').value||0);$('billTotal').textContent=money(Math.max(0,t));};
  items.querySelector('.rate').addEventListener('input',recalc);items.querySelector('.qty').addEventListener('input',recalc);document.querySelector('[name=discount]').addEventListener('input',recalc);items.querySelector('.product').addEventListener('change',e=>{const p=products.find(x=>x.id===e.target.value);if(p)e.target.closest('.bill-row').querySelector('.rate').value=p.selling_rate;recalc()});items.querySelector('.remove').onclick=e=>{if(items.querySelectorAll('.bill-row').length>1)e.target.closest('.bill-row').remove();recalc()};$('addLine').onclick=()=>{const r=items.querySelector('.bill-row').cloneNode(true);r.querySelectorAll('input').forEach(i=>i.value='');r.querySelector('select').value='';r.querySelector('.remove').onclick=e=>{if(items.querySelectorAll('.bill-row').length>1)e.target.closest('.bill-row').remove();recalc()};r.querySelector('.product').onchange=e=>{const p=products.find(x=>x.id===e.target.value);if(p)r.querySelector('.rate').value=p.selling_rate;recalc()};r.querySelector('.qty').oninput=recalc;r.querySelector('.rate').oninput=recalc;items.appendChild(r)};
  $('billForm').onsubmit=async e=>{
    try{
      e.preventDefault();
      const fd=new FormData(e.target);
      const rows=[...items.querySelectorAll('.bill-row')].map(r=>{
        const product=products.find(p=>p.id===r.querySelector('.product').value);
        return product?{product,qty:Number(r.querySelector('.qty').value||0),rate:Number(r.querySelector('.rate').value||0)}:null
      }).filter(Boolean);
      if(!rows.length||rows.some(x=>x.qty<=0)){
        $('billMsg').innerHTML=msg('error','Add at least one valid product and quantity.');
        return;
      }
      const subtotal=rows.reduce((s,x)=>s+x.qty*x.rate,0);
      const discount=Number(fd.get('discount')||0);
      const total=Math.max(0,subtotal-discount);
      const paid=Math.max(0,Math.min(total,Number(fd.get('paid')||0)));
      const customerId=fd.get('customer')||null;
      const {data:{user:currentUser}}=await sb.auth.getUser();
      if(!currentUser) throw new Error('Session expired. Please sign in again.');

      const {data:bill,error}=await sb.rpc('create_sale',{
        p_shop_id:state.shop.id,
        p_customer_id:customerId,
        p_subtotal:subtotal,
        p_discount:discount,
        p_grand_total:total,
        p_paid_amount:paid,
        p_payment_method:paid?'cash':null,
        p_items:rows.map(x=>({
          product_id:x.product.id,
          quantity:x.qty,
          rate:x.rate
        }))
      });

      if(error) throw error;
      if(!bill) throw new Error('Bill was not created.');
      closeModal();
      await loadAll();
      render();
    }catch(err){
      $('billMsg').innerHTML=msg('error',err?.message||String(err));
    }
  };
}

async function createBillPdf(b,c,items,paid,due){
  const {jsPDF}=await import('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm');
  const doc=new jsPDF({unit:'mm',format:'a4'});
  let y=18;
  const line=(label,value,x1=110,x2=190)=>{doc.setFontSize(10);doc.text(String(label),x1,y);doc.text(String(value),x2,y,{align:'right'});y+=7;};
  doc.setFontSize(20);doc.setFont(undefined,'bold');doc.text('Ritam Enterprise',105,y,{align:'center'});y+=7;
  doc.setFontSize(10);doc.setFont(undefined,'normal');doc.text('Non-GST Invoice',105,y,{align:'center'});y+=10;
  doc.setFontSize(11);doc.setFont(undefined,'bold');doc.text('Bill '+b.bill_number,20,y);doc.setFont(undefined,'normal');doc.text(new Date(b.bill_date).toLocaleString('en-IN'),190,y,{align:'right'});y+=8;
  doc.text('Customer: '+(c?.name||'Walk-in'),20,y);if(c?.phone)doc.text('Phone: '+c.phone,190,y,{align:'right'});y+=9;
  doc.line(20,y,190,y);y+=7;
  doc.setFont(undefined,'bold');doc.text('Item',20,y);doc.text('Qty',115,y,{align:'right'});doc.text('Rate',150,y,{align:'right'});doc.text('Amount',190,y,{align:'right'});y+=6;
  doc.setFont(undefined,'normal');
  for(const i of items){if(y>270){doc.addPage();y=18;}doc.text(String(i.product_name||''),20,y,{maxWidth:85});doc.text(String(i.quantity)+' '+String(i.unit||''),115,y,{align:'right'});doc.text(money(i.rate),150,y,{align:'right'});doc.text(money(i.amount),190,y,{align:'right'});y+=7;}
  y+=3;doc.line(110,y,190,y);y+=7;line('Subtotal',money(b.subtotal));line('Discount',money(b.discount));doc.setFont(undefined,'bold');line('Total',money(b.grand_total));doc.setFont(undefined,'normal');line('Paid',money(paid));line('Outstanding',money(due));
  y+=8;doc.setFontSize(9);doc.setFont(undefined,'normal');doc.text('Thank you for your business.',105,y,{align:'center'});
  return new File([doc.output('blob')],'Ritam-Enterprise-'+b.bill_number+'.pdf',{type:'application/pdf'});
}
function paymentModal(){
  modal(`<div class="modal-head"><h3>Record payment</h3><button class="btn secondary" onclick="window.closeModal()">Close</button></div>
  <form id="paymentForm"><div class="form-grid">
  <div class="field"><label>Customer</label><select name="customer" id="paymentCustomer" required><option value="">Select customer</option>${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
  <div class="field"><label>Bill (optional)</label><select name="bill" id="paymentBill"><option value="">General / unallocated payment</option></select></div>
  <div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" min="0.01" required></div>
  <div class="field"><label>Method</label><select name="method"><option>cash</option><option>UPI</option><option>bank transfer</option><option>cheque</option><option>other</option></select></div>
  <div class="field"><label>Reference</label><input name="ref" placeholder="UPI ref / cheque no."></div>
  </div><button class="btn accent" type="submit">Save payment</button><div id="formMsg"></div></form>`);
  const customerSel=$('paymentCustomer'),billSel=$('paymentBill');
  const refreshBills=()=>{const cid=customerSel.value;billSel.innerHTML='<option value="">General / unallocated payment</option>'+state.bills.filter(b=>b.customer_id===cid&&billOutstanding(b)>0).map(b=>`<option value="${b.id}">${esc(b.bill_number)} — outstanding ${money(billOutstanding(b))}</option>`).join('')};
  customerSel.onchange=refreshBills;
  $('paymentForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {data,error}=await sb.rpc('record_payment',{p_shop_id:state.shop.id,p_customer_id:f.get('customer'),p_bill_id:f.get('bill')||null,p_amount:Number(f.get('amount')),p_payment_method:f.get('method'),p_reference:f.get('ref')||null});if(error){$('formMsg').innerHTML=msg('error',error.message);return}closeModal();await loadAll();render()};
}
function exportBills(){const rows=[['Bill','Date','Customer','Subtotal','Discount','Total','Paid','Outstanding'],...state.bills.map(b=>[b.bill_number,b.bill_date,state.customers.find(c=>c.id===b.customer_id)?.name||'Walk-in',b.subtotal,b.discount,b.grand_total,billPayments(b),billOutstanding(b)])];const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ritam-enterprise-bills.csv';a.click();URL.revokeObjectURL(a.href)}

window.closeModal=closeModal;
$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;state.page=b.dataset.page;render()});
$('themeToggle').addEventListener('click',()=>applyTheme(document.body.classList.contains('dark')?'light':'dark'));
$('quickBill').onclick=()=>{state.page='billing';render();setTimeout(billModal,0)};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function enterApp(){
  try{await loadAll();showApp();}catch(err){setAuthMessage('error',err.message);}
}
async function setupPasskey(){
  if(!window.PublicKeyCredential){setAuthMessage('error','Passkeys are not supported in this browser.');return;}
  setAuthMessage('success','Opening Face ID / fingerprint setup…');
  const r=await sb.auth.registerPasskey();
  if(r.error){setAuthMessage('error',r.error.message);return;}
  setAuthMessage('success','Face ID / fingerprint is now enabled for Ritam Enterprise on this device.');
}
async function loginWithPasskey(){
  if(!window.PublicKeyCredential){setAuthMessage('error','Passkeys are not supported in this browser.');return;}
  setAuthMessage('success','Waiting for Face ID / fingerprint…');
  const r=await sb.auth.signInWithPasskey();
  if(r.error){setAuthMessage('error',r.error.message);return;}
  await enterApp();
}
$('setupPasskey').onclick=setupPasskey;
$('passkeyLogin').onclick=loginWithPasskey;

$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  const email=$('email').value.trim(), password=$('password').value;
  if(!email || !password){setAuthMessage('error','Enter your email and password, or use Face ID / fingerprint.');return;}
  setAuthMessage('success','Signing in…');
  const r=await sb.auth.signInWithPassword({email,password});
  if(r.error){setAuthMessage('error',r.error.message);return;}
  await enterApp();
};

sb.auth.onAuthStateChange(async (_event,session)=>{
  if(session && $('app').classList.contains('hidden')) await enterApp();
});
initTheme();
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){try{await loadAll();showApp()}catch(e){setAuthMessage('error',e.message)}}})();
</script>
